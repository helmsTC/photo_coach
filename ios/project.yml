# Generate the Xcode project with XcodeGen:   brew install xcodegen && cd ios && xcodegen
name: PhotoCoach
options:
  bundleIdPrefix: com.mosaiclens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
fileGroups:
  - ApertureIQ.storekit
targets:
  PhotoCoach:
    type: application
    platform: iOS
    sources:
      - path: PhotoCoach/Sources
      - path: PhotoCoach/Resources
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        # merged into the generated Info.plist (export-compliance answer)
        INFOPLIST_FILE: PhotoCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ApertureIQ
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaiclens.apertureiq
        DEVELOPMENT_TEAM: 5597Q8K56P
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # self-test fixtures: only the Debug build has the self-test
          EXCLUDED_SOURCE_FILE_NAMES: "parity.json parity_louise_03.jpg"
    scheme:
      # local StoreKit testing: purchases work in Xcode runs before App Store Connect is set up
      storeKitConfiguration: ApertureIQ.storekit
